name: Build Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build-linux:
    # 22.04 keeps the glibc requirement at 2.35 (latest = 2.38+).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # mlugg/setup-zig still targets Node 20 (deprecation warnings in CI),
      # so Zig is installed by hand: cached compiler + cached build cache.
      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: |
            ~/zig
            ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ env.ZIG_VERSION }}-${{ github.job }}-

      - name: Setup Zig
        run: |
          if [ ! -x "$HOME/zig/zig" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
            mkdir -p "$HOME/zig"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          fi
          echo "$HOME/zig" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/zig/local" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev xorg-dev

      - name: Build
        # -Dcpu=baseline: without it Zig targets the CI runner's CPU (AVX-512),
        # which is an illegal instruction on Steam Deck (Zen 2) and most PCs.
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline -Dversion=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: buzzness-tycoon-linux
          path: zig-out/bin/buzzness-tycoon

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: |
            ~/zig
            ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ env.ZIG_VERSION }}-${{ github.job }}-

      - name: Setup Zig
        run: |
          if [ ! -x "$HOME/zig/zig" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
            mkdir -p "$HOME/zig"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          fi
          echo "$HOME/zig" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/zig/local" >> "$GITHUB_ENV"

      - name: Build for Windows
        run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseFast -Dversion=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: buzzness-tycoon-windows
          path: zig-out/bin/buzzness-tycoon.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: |
            ~/zig
            ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-${{ env.ZIG_VERSION }}-${{ github.job }}-

      - name: Setup Zig
        run: |
          if [ ! -x "$HOME/zig/zig" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-macos-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
            mkdir -p "$HOME/zig"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          fi
          echo "$HOME/zig" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/zig/local" >> "$GITHUB_ENV"

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dversion=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Upload macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: buzzness-tycoon-macos
          path: zig-out/bin/buzzness-tycoon

  release:
    if: github.event_name == 'release'
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: buzzness-tycoon-linux
          path: ./linux

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: buzzness-tycoon-windows
          path: ./windows

      - name: Download macOS binary
        uses: actions/download-artifact@v8
        with:
          name: buzzness-tycoon-macos
          path: ./macos

      # Official Steam Input layouts ride inside the archives so the Steam
      # depots (staged from these exact files) pick them up — see steam_input/.
      - name: Check out repo for steam_input configs
        uses: actions/checkout@v7
        with:
          path: ./repo

      - name: Create archives
        run: |
          rm -f repo/steam_input/README.md
          for d in linux windows macos; do cp -r repo/steam_input "$d"/; done
          cd linux && tar -czf ../buzzness-tycoon-linux-x86_64.tar.gz buzzness-tycoon steam_input && cd ..
          cd windows && zip -r ../buzzness-tycoon-windows-x86_64.zip buzzness-tycoon.exe steam_input && cd ..
          cd macos && chmod +x buzzness-tycoon && tar -czf ../buzzness-tycoon-macos-arm64.tar.gz buzzness-tycoon steam_input && cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            buzzness-tycoon-linux-x86_64.tar.gz
            buzzness-tycoon-windows-x86_64.zip
            buzzness-tycoon-macos-arm64.tar.gz
