<style>
@font-face{font-family:BoldPixels;src:url('../../../sprites/boldpixels.ttf')}*{box-sizing:border-box} :root{--base:#1e1e2e;--mantle:#181825;--crust:#11111b;--surface:#313244;--line:#585b70;--text:#cdd6f4;--muted:#a6adc8;--green:#a6e3a1;--yellow:#f9e2af;--pink:#f5c2e7;--blue:#89b4fa;--peach:#fab387}body{margin:0;color:var(--text);background:var(--base);font:16px BoldPixels,system-ui;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;transition:background .15s,transform .15s}button:hover{background:#45475a}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{opacity:.45;cursor:default}h1,h2,h3,p{margin:0}h1{font-size:28px;line-height:1.2;color:var(--yellow)}h2{font-size:20px}h3{font-size:16px}small,.muted{color:var(--muted)}small{font-size:13px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--green)}.card{background:#181825f5;border:1px solid #585b7070;border-radius:15px;padding:20px;box-shadow:0 8px 30px #11111b30}.row{display:flex;align-items:center;gap:12px}.spread{justify-content:space-between}.stack{display:grid;gap:12px}.primary{background:var(--yellow);color:var(--crust);border-color:var(--yellow);font-weight:700}.primary:hover{background:#f5c2e7}.pill{padding:4px 10px;border:1px solid #585b70;border-radius:20px;font-size:12px}.green{color:var(--green)}.peach{color:var(--peach)}.meter{height:7px;background:#45475a;border-radius:8px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--yellow);border-radius:8px}.amount{font-size:32px;font-weight:650;line-height:1.2;color:var(--yellow)}.amount small{font-size:16px}.bee-count{color:var(--yellow);font-size:21px}.status{min-height:24px;color:var(--green)}#app{position:relative;min-height:100vh;padding-bottom:92px;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.meadow{position:relative;min-height:350px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#45475a 0,#313244 50%,#1e1e2e 90%);border-radius:14px}.meadow:after{content:'THE MEADOW  ·  afternoon';position:absolute;left:22px;bottom:18px;color:var(--green);font-size:12px;letter-spacing:2px}.meadow canvas{position:absolute;inset:0}.flower{width:48px;height:48px;image-rendering:pixelated;background-size:240px 48px;background-position:right center;flex-shrink:0}.species{display:flex;gap:7px;flex-wrap:wrap}.species button{padding:4px 8px}.species button[aria-pressed=true]{border-color:var(--green);background:#a6e3a125}.buy{display:flex;align-items:center;gap:9px}.buy img{width:36px;image-rendering:pixelated}.buy small{display:block;font-size:11px;line-height:1.1}.goal-progress{font-size:13px}.divider{height:1px;background:#585b7055;margin:8px 0}.kicker{font-size:13px;color:var(--muted)}.tip{padding:12px 15px;border-left:3px solid var(--green);background:#a6e3a110;border-radius:0 8px 8px 0;font-size:14px}.research-item{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}.research-item.active{border-color:var(--pink);background:#f5c2e718}.research-item span small{display:block}.inspector{border-top:3px solid var(--pink)}.inspector p{font-size:15px;line-height:1.5}.effect{padding:12px;background:var(--surface);border-radius:8px}.switcher{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px;background:var(--crust);border:1px solid var(--pink);border-radius:14px;box-shadow:0 8px 30px #0008;white-space:nowrap}.switcher button{padding:5px 12px}.switcher label{font-size:13px;min-width:190px;text-align:center}.switcher small{display:block;font-size:10px;color:var(--pink)}.labtools{position:fixed;z-index:9;bottom:18px;right:18px;display:flex;gap:6px}.labtools button{font-size:12px;padding:6px 10px}.toast{position:fixed;z-index:12;top:14px;left:50%;transform:translateX(-50%);border:1px solid var(--green);padding:9px 22px;border-radius:8px;background:var(--crust);pointer-events:none;opacity:0;transition:opacity .2s}.toast.visible{opacity:1}
/* A: meadow-first floating islands, contextual research drawer. */
.variant-a>.meadow{position:absolute;inset:0 0 92px;min-height:0;border-radius:0}.a-top{position:relative;display:flex;align-items:start;justify-content:space-between;padding:25px;gap:20px}.a-economy{width:285px}.a-goal{width:300px}.a-bottom{position:relative;margin:290px 25px 20px;display:flex;justify-content:space-between;align-items:end;gap:20px}.a-dock{max-width:550px}.a-research{width:325px}.variant-a .meadow:after{bottom:260px}
.variant-a{height:100vh;min-height:800px!important}.a-bottom{position:absolute;inset:220px 25px 110px;margin:0;pointer-events:none}.a-bottom>section{pointer-events:auto}.a-research{align-self:start}.a-dock{align-self:end}.research-tabs{display:flex;gap:5px}.research-tabs button{padding:6px;font-size:12px}.research-tabs small,.research-tabs button>span:last-child{display:none!important}.a-goal>button{display:none}.a-research p{font-size:13px}.a-research{gap:8px;padding:16px}
/* B: a field journal with a persistent chapter rail and compact task strip. */
.variant-b{display:grid;grid-template-columns:265px minmax(0,1fr);gap:0}.journal{background:var(--mantle);padding:30px 22px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}.chapter{display:flex;gap:12px;align-items:center;margin:12px 0;color:var(--muted)}.chapter em{font-style:normal;width:29px;height:29px;border:1px solid var(--line);border-radius:50%;text-align:center;line-height:29px}.chapter.current{color:var(--green)}.chapter.current em{background:var(--green);color:var(--base)}.journal-main{padding:25px;display:grid;gap:18px;grid-template-rows:auto minmax(350px,1fr) auto}.journal-main>.meadow{min-height:355px}.journal-footer{display:grid;grid-template-columns:1fr 1fr;gap:18px}.journal button{width:100%}.journal .chaptertitle{font-size:25px;color:var(--pink)}
/* C: research workbench; the meadow is a reference pane beside a linear plan. */
.variant-c{padding:25px 30px 100px!important;display:grid;gap:20px}.c-header{display:flex;align-items:center;justify-content:space-between;gap:15px}.c-body{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.15fr) minmax(240px,.8fr);gap:20px}.c-body>.stack{align-content:start}.c-body .meadow{height:280px;min-height:280px}.roadmap{padding:20px;border-left:2px solid var(--line);margin-left:10px;display:grid;gap:14px}.roadmap button{position:relative}.roadmap button:before{content:'';width:11px;height:11px;background:var(--pink);border:4px solid var(--base);border-radius:50%;position:absolute;left:-31px;top:20px}.workbench-honey{min-width:260px}.c-foot{display:flex;gap:20px;align-items:center}.debug{font-size:12px;color:var(--muted);margin-top:8px}.prototype-label{color:var(--pink);font-size:11px;letter-spacing:1px}
@media(max-width:1050px){.labtools{bottom:74px}.variant-c .c-body{grid-template-columns:1fr 1fr}.c-body>.inspector{grid-column:1/-1}.a-bottom{margin-top:230px}.variant-b{grid-template-columns:220px 1fr}.journal-main{padding:18px}.journal-footer{grid-template-columns:1fr}.variant-c{padding:18px 18px 100px!important}.c-header{flex-wrap:wrap}}
@media(max-width:650px){.variant-a{height:auto}.a-bottom{position:relative;inset:auto;pointer-events:auto}.a-top{padding:14px!important}.a-top,.a-bottom{padding:14px;margin:0;display:grid;grid-template-columns:1fr}.a-top{margin-bottom:170px}.a-economy,.a-goal,.a-research{width:auto}.a-goal{display:none}.variant-b{grid-template-columns:1fr}.journal{padding:18px;gap:16px}.chapters{display:flex;gap:10px;flex-wrap:wrap}.journal-main>.meadow{min-height:260px}.variant-c .c-body{grid-template-columns:1fr}.workbench-honey{width:100%}.switcher{gap:4px}.switcher label{min-width:160px}.switcher .reset{display:none}.labtools{bottom:72px}.c-foot{flex-wrap:wrap}.a-bottom{padding-bottom:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Selected direction: quiet meadow controls, full progression destinations. */
.variant-a .a-research{align-self:end;width:320px}.destination{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:15px;border-color:var(--blue);font-size:20px}.destination small{display:block;font-size:12px}.destination.royal{border-color:var(--pink)}.a-goal>button{display:block}.a-goal{padding:16px}.a-goal .eyebrow{font-size:11px}.a-goal h2{font-size:18px}.progression{position:absolute;inset:0 0 92px;background:var(--mantle);padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto}.progression header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}.progression h1{font-size:25px}.progression .nav{display:flex;gap:8px;flex-wrap:wrap}.tree-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;flex:1;min-height:360px}.tree-scroll{overflow:auto;background:var(--base);border:1px solid var(--line);border-radius:12px;min-height:320px;cursor:grab;touch-action:pan-x pan-y}.tree-map{position:relative;transform-origin:0 0}.tree-map svg{position:absolute;inset:0;pointer-events:none}.tree-node{position:absolute;width:240px;height:60px;text-align:left;font-size:20px;border-width:2px;box-shadow:0 4px 0 #11111b80}.tree-node small{display:block;font-size:16px}.tree-node.locked{border-style:dashed;color:var(--muted)}.tree-node.owned{border-color:var(--green)}.tree-node.selected{outline:3px solid var(--yellow);outline-offset:3px}.tree-node.ready{border-color:var(--blue)}.tree-inspector{align-content:start;padding:18px;overflow:auto}.tree-inspector .requirement{text-align:left;font-size:13px}.tree-inspector .effect{font-size:14px}.tree-scroll::-webkit-scrollbar{height:12px;width:12px}.tree-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}.royal-layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:20px}.royal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.royal-card{display:grid;gap:10px;border-top:2px solid var(--pink);padding:18px}.royal-card p{font-size:14px;color:var(--muted)}.royal-card h2{font-size:18px}.jelly{color:var(--pink);font-size:26px}.royal-aside{align-content:start}.royal-lock{border-color:var(--pink);background:#f5c2e712}.progression .tip{font-size:13px}.tree-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tree-toolbar button{font-size:12px;padding:5px 12px}.map-legend{font-size:12px;color:var(--muted)}
@media(max-width:900px){.tree-layout{grid-template-columns:1fr;min-height:650px}.tree-scroll{height:350px;flex-shrink:0}.tree-inspector{overflow:visible}.royal-layout{grid-template-columns:1fr}.progression{padding:16px}.progression header{align-items:start;flex-wrap:wrap}.royal-grid{grid-template-columns:1fr 1fr}.variant-a .a-research{width:280px}.variant-a .a-dock{max-width:420px}.variant-a .a-bottom{gap:12px}.variant-a .a-goal{width:260px}}
@media(max-width:650px){.variant-a .a-research{width:auto}.royal-grid{grid-template-columns:1fr}.variant-a .a-goal{display:none}.progression .nav button{font-size:13px}.labtools{flex-wrap:wrap;max-width:230px;justify-content:end}}
.variant-a .a-economy{width:360px;max-width:100%;position:relative}.honey-strip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:8px 14px 12px;background:#181825dc;border:0;border-radius:8px;overflow:hidden;font-size:14px}.honey-strip b{font-size:24px;color:var(--yellow)}.honey-strip i{position:absolute;bottom:4px;left:0;height:3px;background:var(--yellow)}.honey-info{display:none;position:absolute;top:65px;background:var(--mantle);padding:12px;border-radius:8px;font-size:13px;color:var(--muted);z-index:3}.a-economy:hover .honey-info,.a-economy:focus-within .honey-info{display:block}

<body><main id="app"></main><div class="toast" role="status" aria-live="polite"></div>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><label id="variant-label"></label><button id="next" aria-label="Next variant">→</button><button class="reset" id="reset">Reset</button></nav>
<div class="labtools"><button id="late-run">Late run</button><button id="advance">+10s</button><button id="fill">Fill storage</button></div>
<script>
// Three structurally different game HUDs. Disposable mock economy, no persistence.
// Native Raylib has no web route: this standalone preview is never in the game build.
const $=s=>document.querySelector(s), names={A:'Meadow first',B:'Field journal',C:'Research workbench'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
const initial=()=>({honey:420,cap:500,bees:24,rate:12,storage:0,growth:0,tailwind:0,selected:'storage',flower:'pink_tulip',pinned:'storage',spent:0,view:'meadow',treeSelected:13,levels:{0:1},treePinned:13,jelly:500,shop:[0,0,0,0,0,0,0],ascensions:0});let state=initial();
const upgrades={storage:{name:'Room for more',sub:'Storage',cost:150,desc:'Keep more of what your colony earns. A larger honey pot gives you room to save for your next upgrade.',effect:()=>`${state.cap.toLocaleString()} → ${(state.cap+500).toLocaleString()} honey capacity`},growth:{name:'A meadow in bloom',sub:'Fertile Soil',cost:250,desc:'Give the whole meadow a little encouragement. Flowers bloom sooner and replenish pollen faster.',effect:()=>`Flower growth ×${(1+state.growth*.2).toFixed(1)} → ×${(1+(state.growth+1)*.2).toFixed(1)}`},tailwind:{name:'A gentle tailwind',sub:'Tailwind',cost:600,desc:'Shorter journeys let bees return to the hive sooner. Particularly useful when the meadow is wide.',effect:()=>`Flight speed ×${(1+state.tailwind*.1).toFixed(1)} → ×${(1+(state.tailwind+1)*.1).toFixed(1)}`}};
const num=n=>Math.floor(n).toLocaleString();const cost=k=>upgrades[k].cost*(state[k]+1);const full=()=>state.honey>=state.cap;const asset=n=>'../../../sprites/'+n+'.png';
function economy(){return `<div class="eyebrow">Honey in the hive</div><div class="amount">${num(state.honey)} <small>/ ${num(state.cap)}</small></div><div class="meter"><i style="width:${Math.min(100,state.honey/state.cap*100)}%"></i></div><div class="row spread"><span class="${full()?'peach':'green'}">${full()?'Storage full · income lost':`+${state.rate}/s · steady gathering`}</span></div>${full()?'<button class="primary" data-select="storage" style="margin-top:10px">Make room →</button>':''}`}
function goal(){const k=state.pinned,u=upgrades[k],c=cost(k);return `<div class="eyebrow">Your next little goal</div><h2>${u.name}</h2><p class="goal-progress">${num(state.honey)} / ${num(c)} honey ${c>state.cap?'· needs more storage':state.honey>=c?'· ready!':`· ~${Math.ceil((c-state.honey)/state.rate)}s`}</p><div class="meter"><i style="width:${Math.min(100,state.honey/c*100)}%"></i></div><button data-select="${k}">See upgrade →</button>`}
function buy(){return `<button class="buy" id="buy-bee" ${state.honey<20?'disabled':''}><img alt="" src="${asset('bee')}"><span>Welcome a worker<small>20 honey · ${state.bees} in your hive</small></span></button>`}
function flowers(){return `<div class="species">${['rose','pink_tulip','poppy','hyacinth','iris'].map(f=>`<button data-flower="${f}" aria-label="Choose ${f.replaceAll('_',' ')}" aria-pressed="${state.flower===f}"><div class="flower" style="background-image:url('${asset(f)}')"></div></button>`).join('')}</div><small>Preview a flower in the meadow · ${state.flower.replaceAll('_',' ')}</small>`}
function research(){return Object.entries(upgrades).map(([k,u])=>`<button class="research-item ${state.selected===k?'active':''}" data-select="${k}"><span>${u.sub}<small>Level ${state[k]} · ${num(cost(k))} honey</small></span><span>${cost(k)>state.cap?'↗':state.honey>=cost(k)?'●':'○'}</span></button>`).join('')}
function inspector(){const k=state.selected,u=upgrades[k],c=cost(k);return `<div class="eyebrow">${u.sub} · Level ${state[k]}</div><h2>${u.name}</h2><p>${u.desc}</p><div class="effect"><small>Now → next</small><div>${u.effect()}</div></div>${c>state.cap?'<div class="tip">Your storage is too small for this purchase.</div><button class="primary" data-select="storage">Go to Storage →</button>':`<button class="primary" id="purchase" ${state.honey<c?'disabled':''}>${state.honey>=c?'Upgrade':'Save up'} · ${num(c)} honey</button>`}<button id="pin">${state.pinned===k?'✓ Pinned as your goal':'Pin as my next goal'}</button>`}
const meadow=()=>'<div class="meadow"><canvas aria-label="Animated pixel-art meadow preview"></canvas></div>';
function slimEconomy(){return `<button class="honey-strip" data-tree="13" aria-label="Honey and storage; open Storage in the tree"><span><b>${num(state.honey)}</b> <small>/ ${num(state.cap)}</small></span><span class="${full()?'peach':'green'}">${full()?'Full · Storage →':`+${state.rate}/s`}</span><i style="width:${Math.min(100,state.honey/state.cap*100)}%"></i></button><div class="honey-info">${full()?`${state.rate} honey/s overflowing`:`+${state.rate} honey/s`} · Hive ×1.0<br>Select to inspect Storage</div>`}
function VariantA(){return `${meadow()}<div class="a-top"><section class="a-economy">${slimEconomy()}</section><section class="card a-goal stack">${treeGoal()}</section></div><div class="a-bottom"><section class="card a-dock stack"><div class="row spread"><h2>A busy little meadow</h2><span class="pill">Day 12</span></div>${buy()}${flowers()}</section><section class="card a-research stack"><div class="eyebrow">Let your hive grow</div><button class="destination" data-view="tree"><span>✧ Upgrade Tree<small>${TREE.length-1} upgrades · explore every branch</small></span><span>→</span></button><button class="destination royal" data-view="royal"><span>♛ Royal Shop<small>Permanent perks · ${num(state.jelly)} Royal Jelly</small></span><span>→</span></button><small>${state.levels[19]?'Prestige unlocked this run':'Royal purchases unlock with Prestige this run'}</small></section></div>`}
function VariantB(){return `<aside class="journal"><div><div class="eyebrow">The beekeeper's journal</div><h1>One bloom<br>at a time.</h1></div><div class="chapters"><div class="chapter"><em>✓</em><span>Make yourself at home</span></div><div class="chapter current"><em>2</em><span>A thriving meadow</span></div><div class="chapter"><em>3</em><span>A royal beginning</span></div></div><section class="stack"><div class="chaptertitle">Today's intention</div>${goal()}</section><div class="tip">There is no rush.<br>Your colony keeps working while you explore.</div><div class="debug">Chapters are suggested milestones, not locked quests.</div></aside><section class="journal-main"><header class="row spread"><div><div class="eyebrow">Chapter two</div><h1>A thriving meadow</h1></div><span class="pill">${state.bees} bees · Day 12</span></header>${meadow()}<div class="journal-footer"><section class="card stack">${economy()}${buy()}${flowers()}</section><section class="card stack inspector"><div class="row">${Object.entries(upgrades).map(([k,u])=>`<button data-select="${k}" aria-label="Inspect ${u.sub}">${u.sub}</button>`).join('')}</div>${inspector()}</section></div></section>`}
function VariantC(){return `<header class="c-header"><div><div class="eyebrow">Plan a little. Grow a lot.</div><h1>The hive workshop</h1><p class="muted">Choose your next step, then return to the flowers.</p></div><section class="card workbench-honey">${economy()}</section></header><div class="c-body"><section class="stack">${meadow()}<div class="card stack"><h2>Your colony</h2>${buy()}${flowers()}</div></section><section class="card stack"><div class="row spread"><h2>A path to grow</h2><span class="pill">Explore freely</span></div><p class="muted">Simple choices, with room to see what each one changes.</p><div class="roadmap">${research()}</div><div class="tip">One clear next step can replace a screen full of countdowns.</div><div class="divider"></div>${goal()}</section><section class="card stack inspector">${inspector()}<div class="debug">Prototype state<br>Spent: ${num(state.spent)} · Bees: ${state.bees}<br>Storage: Lv ${state.storage} · Growth: Lv ${state.growth}<br>Tailwind: Lv ${state.tailwind}</div></section></div><footer class="c-foot"><span class="pill">Hive ×1.0</span><span class="pill">Afternoon · no night bonus</span><span class="muted">Meadow preview and purchases use a shared mock economy.</span></footer>`}

// Topology, names, base prices and caps mirrored from src/upgrade_tree.zig.
// UI-only fixture: production income, price scaling and reset rewards are not simulated.
const TREE=[{"id":0,"name":"Worker Bee","cost":0.0,"col":0,"row":0,"deps":[],"cap":1,"growth":1.0,"per":0,"effect":"bee_unlock_worker"},{"id":1,"name":"Honey Doubler","cost":50.0,"col":-2,"row":1,"deps":[[0,1]],"cap":5,"growth":1.0,"per":0,"effect":"honey_factor_mul"},{"id":24,"name":"Honey Boost","cost":8000.0,"col":-2,"row":2,"deps":[[1,5]],"cap":10,"growth":1.5,"per":5,"effect":"honey_factor_mul"},{"id":4,"name":"Swift Bee","cost":80.0,"col":-3,"row":1,"deps":[[0,1]],"cap":1,"growth":1.0,"per":0,"effect":"bee_unlock_swift"},{"id":5,"name":"Efficient Bee","cost":400.0,"col":-3,"row":2,"deps":[[4,1]],"cap":1,"growth":1.0,"per":0,"effect":"bee_unlock_efficient"},{"id":6,"name":"Gardener Bee","cost":2000.0,"col":-3,"row":3,"deps":[[5,1]],"cap":1,"growth":1.0,"per":0,"effect":"bee_unlock_gardener"},{"id":26,"name":"Green Thumb","cost":2500.0,"col":-3,"row":4,"deps":[[6,1]],"cap":8,"growth":1.5,"per":0,"effect":"gardener_chance"},{"id":27,"name":"Composting","cost":6000.0,"col":-3,"row":5,"deps":[[26,1]],"cap":1,"growth":1.0,"per":0,"effect":"gardener_compost"},{"id":28,"name":"Seed Scouts","cost":15000.0,"col":-3,"row":6,"deps":[[27,1]],"cap":1,"growth":1.0,"per":0,"effect":"gardener_sow"},{"id":36,"name":"Worker Drills","cost":200.0,"col":-4,"row":1,"deps":[[0,1]],"cap":5,"growth":1.6,"per":2,"effect":"bee_training"},{"id":37,"name":"Swift Drills","cost":600.0,"col":-4,"row":2,"deps":[[4,1]],"cap":5,"growth":1.6,"per":2,"effect":"bee_training"},{"id":38,"name":"Efficient Drills","cost":1500.0,"col":-4,"row":3,"deps":[[5,1]],"cap":5,"growth":1.6,"per":2,"effect":"bee_training"},{"id":39,"name":"Gardener Drills","cost":4000.0,"col":-4,"row":4,"deps":[[6,1]],"cap":5,"growth":1.6,"per":2,"effect":"bee_training"},{"id":7,"name":"Grow Speed","cost":60.0,"col":0,"row":2,"deps":[[20,1]],"cap":8,"growth":1.7,"per":0,"effect":"growth_cd_sub"},{"id":10,"name":"Grid Ring","cost":150.0,"col":2,"row":1,"deps":[[0,1]],"cap":10,"growth":3.0,"per":2,"effect":"grid_expand"},{"id":32,"name":"Bulk Order","cost":3000.0,"col":2,"row":2,"deps":[[10,1]],"cap":4,"growth":4.0,"per":0,"effect":"bulk_buy_tier"},{"id":13,"name":"Storage","cost":40.0,"col":3,"row":1,"deps":[[0,1]],"cap":30,"growth":1.6,"per":10,"effect":"storage_add"},{"id":29,"name":"Fertile Soil","cost":300.0,"col":3,"row":2,"deps":[[0,1]],"cap":15,"growth":1.6,"per":5,"effect":"flower_growth_mul"},{"id":31,"name":"Hardy Blooms","cost":2500.0,"col":3,"row":3,"deps":[[0,1]],"cap":6,"growth":1.8,"per":0,"effect":"rot_chance_sub"},{"id":30,"name":"Bee Vitality","cost":800.0,"col":4,"row":1,"deps":[[0,1]],"cap":10,"growth":1.7,"per":2,"effect":"bee_lifespan_mul"},{"id":33,"name":"Night Shift","cost":2000.0,"col":4,"row":2,"deps":[[0,1]],"cap":4,"growth":1.8,"per":0,"effect":"night_penalty_sub"},{"id":34,"name":"Tailwind","cost":1500.0,"col":4,"row":3,"deps":[[0,1]],"cap":5,"growth":1.7,"per":2,"effect":"bee_speed_mul"},{"id":35,"name":"Saddlebags","cost":10000.0,"col":4,"row":4,"deps":[[0,1]],"cap":4,"growth":2.0,"per":1,"effect":"bee_carry_add"},{"id":16,"name":"Lab: Aura","cost":8000.0,"col":-1,"row":4,"deps":[[1,3],[6,1]],"cap":15,"growth":1.8,"per":5,"effect":"lab_aura"},{"id":25,"name":"Aura Reach","cost":5000.0,"col":-1,"row":5,"deps":[[16,1]],"cap":10,"growth":1.6,"per":2,"effect":"aura_reach"},{"id":19,"name":"Prestige","cost":100000.0,"col":0,"row":6,"deps":[[25,1],[21,1]],"cap":1,"growth":1.0,"per":0,"effect":"prestige_unlock"},{"id":20,"name":"Instant Grow","cost":30.0,"col":0,"row":1,"deps":[[0,1]],"cap":1,"growth":1.0,"per":0,"effect":"growth_boost_unlock"},{"id":21,"name":"Super Flowers","cost":3500.0,"col":1,"row":3,"deps":[[7,1],[10,1]],"cap":1,"growth":1.0,"per":0,"effect":"super_flower_unlock"}];
const treeBy=id=>TREE.find(n=>n.id===Number(id));
const level=n=>state.levels[n.id]||0,cap=n=>n.cap+n.per*state.ascensions;
const treeCost=n=>n.id===1?[50,250,1500,3500,10000][Math.min(level(n),4)]:Math.round(n.cost*n.growth**level(n));
const unmet=n=>n.deps.filter(([id,l])=>(state.levels[id]||0)<l);
const treeDone=n=>level(n)>=cap(n);
const treeReady=n=>!treeDone(n)&&!unmet(n).length&&treeCost(n)<=state.honey&&treeCost(n)<=state.cap;
const effects={bee_unlock_worker:'Worker bees collect pollen for the hive.',honey_factor_mul:'Increase the honey earned by your colony.',bee_unlock_swift:'Unlock Swift bees for faster collection trips.',bee_unlock_efficient:'Unlock Efficient bees for richer collection.',bee_unlock_gardener:'Unlock Gardeners to tend and plant the meadow.',gardener_chance:'Gardeners plant more often.',gardener_compost:'Gardeners clear rotten flowers.',gardener_sow:'Idle gardeners seek gaps and plant them.',bee_training:'Train this bee type for faster flights and richer collection.',growth_cd_sub:'Shorten the automatic Instant Grow cooldown.',grid_expand:'Add one ring around the meadow.',bulk_buy_tier:'Unlock another bulk-buy quantity.',storage_add:'Increase how much honey the hive can hold.',flower_growth_mul:'Flowers mature and replenish pollen faster.',rot_chance_sub:'Reduce the chance that old flowers rot.',bee_lifespan_mul:'Extend bee lifetimes.',night_penalty_sub:'Reduce the nighttime production penalty.',bee_speed_mul:'All bees fly faster.',bee_carry_add:'Bees visit more flowers before returning home.',lab_aura:'Flowers in the hive aura yield bonus pollen.',aura_reach:'Expand the hive aura.',prestige_unlock:'Unlock Ascend and Royal Shop purchases for this run.',growth_boost_unlock:'Automatically mature a growing flower when the cooldown fills.',super_flower_unlock:'Merge a 2×2 patch of matching flowers into a SUPER flower.'};
let treeZoom=.65,treePan={x:360,y:0};
function treeGoal(){const n=treeBy(state.treePinned),c=treeCost(n);return `<div class="eyebrow">Pinned from your tree</div><h2>${n.name}</h2><small>${treeDone(n)?'Run cap reached':unmet(n).length?'Follow its prerequisites':c>state.cap?'Needs more storage':state.honey>=c?'Ready when you are':`${num(state.honey)} / ${num(c)} honey`}</small><div class="meter"><i style="width:${Math.min(100,state.honey/Math.max(c,1)*100)}%"></i></div><button data-tree="${n.id}">Find in tree →</button>`}
function nodePosition(n){return {x:30+(n.col+4)*260,y:35+n.row*84}}
function treeMap(){let lines='';for(const n of TREE){const b=nodePosition(n);for(const [id] of n.deps){const a=nodePosition(treeBy(id));const mid=(a.y+60+b.y)/2;lines+=`<path d="M${a.x+120},${a.y+60} V${mid} H${b.x+120} V${b.y}" fill="none" stroke="${state.levels[id]?'#89b4fa':'#585b70'}" stroke-width="2"/>`}}return `<div class="tree-toolbar"><button id="tree-minus">−</button><span>${Math.round(treeZoom*100)}%</span><button id="tree-plus">+</button><button id="tree-fit">Fit all</button><button id="tree-full">100%</button>${[['Bees',4],['Honey',1],['Growth',20],['Meadow',10],['Colony',30],['Labs',16]].map(([name,id])=>`<button data-focus="${id}">${name}</button>`).join('')}</div><div class="tree-layout"><div class="tree-scroll" tabindex="0" aria-label="Full upgrade tree; scroll to explore"><div style="width:${2380*treeZoom}px;height:${620*treeZoom}px"><div class="tree-map" style="width:2380px;height:620px;transform:scale(${treeZoom})"><svg width="2380" height="620">${lines}</svg>${TREE.map(n=>{const p=nodePosition(n);return `<button data-tree="${n.id}" class="tree-node ${state.treeSelected===n.id?'selected':''} ${level(n)?'owned':unmet(n).length?'locked':treeReady(n)?'ready':''}" style="left:${p.x}px;top:${p.y}px">${n.name}<small>${n.cap>1?`Lv ${level(n)}/${cap(n)}`:level(n)?'Owned':'Unlock'} · ${treeDone(n)?'Complete':num(treeCost(n))+' honey'}</small></button>`}).join('')}</div></div></div><aside class="card stack tree-inspector">${treeInspector()}</aside></div><div class="map-legend">Solid green: owned · blue: affordable · dashed: prerequisites needed. Select to inspect; purchases use the inspector.</div>`}
function treeInspector(){const n=treeBy(state.treeSelected);return `<div class="eyebrow">Upgrade Tree · ${level(n)?'Owned':'Not yet owned'}</div><h2>${n.name}</h2><p>${effects[n.effect]||n.name}</p><div class="effect">${n.cap>1?`Level ${level(n)} / ${cap(n)} this run`:'One-time unlock per run'}${n.per?`<br>+${n.per} cap per ascension`:''}${n.id===13?`<br>${num(state.cap)} → ${num(state.cap+500*1.6**level(n))} capacity`:''}</div>${unmet(n).map(([id,l])=>`<button class="requirement" data-tree="${id}">Needs ${treeBy(id).name} Lv ${l} →</button>`).join('')}${!treeDone(n)&&treeCost(n)>state.cap?'<button data-tree="13">Increase Storage →</button>':''}<button class="primary" id="tree-purchase" ${treeReady(n)?'':'disabled'}>${treeDone(n)?'Run cap reached':`Buy · ${num(treeCost(n))} Honey`}</button><button id="tree-pin">${state.treePinned===n.id?'✓ Pinned':'Pin as my next goal'}</button>${n.id===19?'<button data-view="royal">Visit Royal Shop →</button>':''}`}
const SHOP=[['Queen’s Blessing','All honey income ×1.1 per level.',50,1.5,40],['Jelly Refinery','Earn 10% more Royal Jelly per level.',150,2,10],['Royal Meadow','Start each run with another meadow ring.',200,2.5,12],['Busy Bees','Start each run with eight extra bees per level.',100,2,5],['Royal Retinue','Start with Swift, Efficient and Gardener unlocked.',400,1,1],['Wholesale Contract','More bulk-buy steps beyond Bulk Order.',300,2,4],["Queen’s Count",'Each bee type doubles output at ownership milestones.',300,1,1]];
function royalShop(){return `<div class="royal-layout"><div class="royal-grid">${SHOP.map(([name,desc,base,growth,max],i)=>{const c=Math.round(base*growth**state.shop[i]);return `<article class="card royal-card"><div class="row spread"><h2>${name}</h2><span class="pill">Lv ${state.shop[i]}/${max}</span></div><p>${desc}</p><button data-shop="${i}" ${!state.levels[19]||state.shop[i]>=max||state.jelly<c?'disabled':''}>${state.shop[i]>=max?'Max level':`${num(c)} Royal Jelly`}</button></article>`}).join('')}</div><aside class="stack royal-aside"><section class="card stack"><div class="eyebrow">Royal Jelly</div><div class="jelly">${num(state.jelly)}</div><p>Shop perks survive ascension. Spending jelly does not reduce your lifetime jelly multiplier.</p></section>${!state.levels[19]?'<section class="card stack royal-lock"><h2>Earn your crown this run</h2><p>Own Prestige in the tree to buy Royal perks or Ascend.</p><button data-tree="19">Find Prestige →</button></section>':'<section class="card stack"><h2>A new beginning</h2><p>Ascend resets this run’s upgrades and raises repeatable caps. Your Royal Shop perks stay.</p><button id="ascend">Ascend · +100 demo jelly</button><small>Fixed reward for this UI experiment.</small></section>'}<span class="pill">${state.ascensions} ascensions · prototype state</span></aside></div>`}
function progressionView(){return `<section class="progression"><header><div><div class="eyebrow">${state.view==='tree'?'Every branch has a place':'A legacy for your hive'}</div><h1>${state.view==='tree'?'Upgrade Tree':'Royal Shop'}</h1></div><div class="nav"><button data-view="meadow">← Meadow</button><button data-view="tree">Upgrade Tree</button><button data-view="royal">♛ Royal Shop</button><span class="pill">${num(state.honey)} honey</span></div></header>${state.view==='tree'?treeMap():royalShop()}</section>`}
function bindProgression(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{state.treeSelected=Number(b.dataset.tree);state.view='tree';render()});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{state.treeSelected=Number(b.dataset.focus);treeZoom=.85;const p=nodePosition(treeBy(state.treeSelected));treePan={x:Math.max(0,p.x*treeZoom-120),y:Math.max(0,p.y*treeZoom-70)};render()});const sc=$('.tree-scroll');if(sc){sc.scrollLeft=treePan.x;sc.scrollTop=treePan.y;sc.onscroll=()=>treePan={x:sc.scrollLeft,y:sc.scrollTop};$('#tree-minus').onclick=()=>{treeZoom=Math.max(.35,treeZoom-.15);render()};$('#tree-plus').onclick=()=>{treeZoom=Math.min(1.5,treeZoom+.15);render()};$('#tree-fit').onclick=()=>{treeZoom=Math.min(sc.clientWidth/2380,sc.clientHeight/620);treePan={x:0,y:0};render()};$('#tree-full').onclick=()=>{treeZoom=1;render()};$('#tree-purchase').onclick=()=>{const n=treeBy(state.treeSelected);if(!treeReady(n))return;state.honey-=treeCost(n);if(n.id===13)state.cap+=500*1.6**level(n);state.levels[n.id]=level(n)+1;render();notify(n.name+' upgraded')};$('#tree-pin').onclick=()=>{state.treePinned=state.treeSelected;render()}}document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.shop),c=Math.round(SHOP[i][2]*SHOP[i][3]**state.shop[i]);if(!state.levels[19]||state.jelly<c||state.shop[i]>=SHOP[i][4])return;state.jelly-=c;state.shop[i]++;render();notify(SHOP[i][0]+' purchased')});const ascend=$('#ascend');if(ascend)ascend.onclick=()=>{state.ascensions++;state.jelly+=100;state.levels={0:1};state.honey=100;state.cap=500;render();notify('New demo run — Royal perks retained')}}

let toastTimer;function notify(t){$('.toast').textContent=t;$('.toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').classList.remove('visible'),2000)}
function render(){const app=$('#app');app.className='variant-'+variant.toLowerCase();app.innerHTML=variant==='A'&&state.view!=='meadow'?progressionView():({A:VariantA,B:VariantB,C:VariantC}[variant])();$('#variant-label').innerHTML=`<small>UI POC · MOCK ECONOMY</small>${variant} — ${names[variant]}`;app.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{if(variant==='A'){state.treeSelected=({storage:13,growth:29,tailwind:34}[b.dataset.select]);state.view='tree'}else state.selected=b.dataset.select;render()});app.querySelectorAll('[data-flower]').forEach(b=>b.onclick=()=>{state.flower=b.dataset.flower;render()});const bee=$('#buy-bee');if(bee)bee.onclick=()=>{if(state.honey<20)return;state.honey-=20;state.spent+=20;state.bees++;state.rate++;render();notify('A new worker joins the colony')};const purchase=$('#purchase');if(purchase)purchase.onclick=()=>{const k=state.selected,c=cost(k);if(c>state.honey||c>state.cap)return;state.honey-=c;state.spent+=c;state[k]++;if(k==='storage')state.cap+=500;else state.rate+=3;render();notify(upgrades[k].sub+' upgraded')};const pin=$('#pin');if(pin)pin.onclick=()=>{state.pinned=state.selected;render();notify('Your next goal is pinned')};bindProgression();drawMeadow(performance.now())}
function switchVariant(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];const u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u);render()}
$('#prev').onclick=()=>switchVariant(-1);$('#next').onclick=()=>switchVariant(1);$('#reset').onclick=()=>{state=initial();render()};$('#advance').onclick=()=>{state.honey=Math.min(state.cap,state.honey+state.rate*10);render();notify('10 seconds of gathering')};$('#late-run').onclick=()=>{state.levels={0:1,1:3,4:1,5:1,6:1,16:1,25:1,7:1,20:1,10:1,21:1,19:1};state.honey=120000;state.cap=200000;render();notify('Late-run fixture loaded — prototype only')};$('#fill').onclick=()=>{state.honey=state.cap;render()};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='Escape'&&state.view!=='meadow'){state.view='meadow';render();return}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)}});
// Actual game sprites, composited directly on canvas without recoloring.
const images={};for(const n of ['grass-cube','beehive','bee','rose','pink_tulip','poppy','hyacinth','iris']){const i=new Image();i.src=asset(n);images[n]=i}let lastFrame=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function drawMeadow(t){const cv=$('canvas');if(!cv)return;const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,w,h);const scale=Math.min(w/550,h/310),tile=32*scale,ox=w/2-tile/2,oy=h/2-4*tile*.5;const pos=(x,y)=>[ox+(x-y)*tile/2,oy+(x+y)*tile/4];for(let y=0;y<9;y++)for(let x=0;x<9;x++){const [px,py]=pos(x,y);if(images['grass-cube'].complete&&images['grass-cube'].naturalWidth)c.drawImage(images['grass-cube'],px,py,tile,tile)}for(let y=0;y<9;y++)for(let x=0;x<9;x++){let n=(x===4&&y===4)?'beehive':(x+y)%3===0?state.flower:((x*7+y*11)%5===0?'rose':null);if(!n)continue;const [px,py]=pos(x,y),im=images[n];if(!im.complete||!im.naturalWidth)continue;if(n==='beehive')c.drawImage(im,px,py-tile*.4,tile,tile);else c.drawImage(im,128,0,32,32,px,py-tile*.6,tile,tile)}const bee=images.bee;if(bee.complete&&bee.naturalWidth)for(let i=0;i<Math.min(state.bees,30);i++){const a=i*2.4+(reduced.matches?0:t*.0002),r=(i%6+1)*tile*.43;c.drawImage(bee,w/2+Math.cos(a)*r,h/2+Math.sin(a*1.3)*r*.45,12*scale,12*scale)}}
function frame(t){if(t-lastFrame>50){drawMeadow(t);lastFrame=t}requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
// Exposed read-only snapshot for the disposable browser playtest.
window.prototypeState=()=>({...state,variant});
</script></body></html>
